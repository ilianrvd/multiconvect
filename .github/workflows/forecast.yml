name: Convective Forecast

on:
  schedule:
    - cron: "40 4,10,16,22 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Micromamba
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-name: mc
          create-args: >-
            python=3.11
            xarray
            cfgrib
            eccodes
            scipy
            numpy
            matplotlib=3.9
            cartopy
            shapely
            pyyaml
            requests

      - name: Install herbie
        shell: bash -l {0}
        run: pip install herbie-data

      - name: Run forecast
        shell: bash -l {0}
        run: |
          mkdir -p logs
          python run.py --auto
          python make_gallery.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v4