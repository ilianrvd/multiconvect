name: Convective Forecast

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Micromamba
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-name: mc
          create-args: >-
            python=3.11
            xarray
            cfgrib
            eccodes
            scipy
            numpy
            matplotlib=3.9
            cartopy
            shapely
            pyyaml
            requests
            openpyxl

      - name: Install herbie
        shell: bash -l {0}
        run: pip install herbie-data

      - name: Run forecast
        shell: bash -l {0}
        run: |
          mkdir -p logs
          python run.py --auto
          python make_gallery.py
          curl -sf "https://ilianrvd.github.io/multiconvect/sigwx/${SECTORS_NAME:-sectors}_state.json" -o prev_sectors_state.json || true
          python make_sigwx.py
          python tools/airports_json.py docs/airports.json
        env:
          SECTORS_NAME: ${{ secrets.SECTORS_NAME }}

      # Latest ICON-EU run at the 26 fogNowcast points (docs/archive_points.md in ilianrvd/fogNowcast)
      # and as grid fields (docs/fog_fields.md). Same run, same downloaded files, one extra write.
      # Independent: if it fails the site is published without these files and SIGWX is unaffected.
      - name: Point values and grid fields (latest_points.json, fog_fields_*)
        continue-on-error: true
        shell: bash -l {0}
        run: python tools/points_run.py --out points_rows.csv --json docs/latest_points.json --fog-dir docs

      # Portal manifest, written last so it reflects what this run actually produced. Independent.
      - name: Manifest (manifest.json)
        continue-on-error: true
        shell: bash -l {0}
        run: python tools/manifest_json.py docs

      - name: Archive run summary (branch stats)
        continue-on-error: true
        shell: bash -l {0}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          if git fetch -q origin stats:stats 2>/dev/null; then
            git worktree add -q ../stats stats
          else
            git worktree add -q --detach ../stats
            (cd ../stats && git checkout -q --orphan stats && git rm -rfq . )
          fi
          python tools/run_summary.py ../stats/stats
          cd ../stats && git add stats && git commit -qm "Run summary $(date -u +%Y-%m-%dT%H:%MZ)" && git push -q origin stats

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      # GitHub sometimes cannot find the just-uploaded artifact (artifact metadata lag since
      # 23.11 evening; a rerun hours later found it). Retry with growing pauses.
      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - if: steps.deploy.outcome == 'failure'
        run: sleep 120

      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - if: steps.deploy2.outcome == 'failure'
        run: sleep 300

      - id: deploy3
        if: steps.deploy2.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - if: steps.deploy3.outcome == 'failure'
        run: sleep 600

      - id: deploy4
        if: steps.deploy3.outcome == 'failure'
        uses: actions/deploy-pages@v4
