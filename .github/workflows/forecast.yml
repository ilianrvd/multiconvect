name: Convective Forecast

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Micromamba
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-name: mc
          create-args: >-
            python=3.11
            xarray
            cfgrib
            eccodes
            scipy
            numpy
            matplotlib=3.9
            cartopy
            shapely
            pyyaml
            requests
            openpyxl

      - name: Install herbie
        shell: bash -l {0}
        run: pip install herbie-data

      - name: Run forecast
        shell: bash -l {0}
        run: |
          mkdir -p logs
          python run.py --auto
          python make_gallery.py
          curl -sf "https://ilianrvd.github.io/multiconvect/sigwx/${SECTORS_NAME:-sectors}_state.json" -o prev_sectors_state.json || true
          python make_sigwx.py
          python tools/airports_json.py docs/airports.json
        env:
          SECTORS_NAME: ${{ secrets.SECTORS_NAME }}

      - name: Archive run summary (branch stats)
        continue-on-error: true
        shell: bash -l {0}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          if git fetch -q origin stats:stats 2>/dev/null; then
            git worktree add -q ../stats stats
          else
            git worktree add -q --detach ../stats
            (cd ../stats && git checkout -q --orphan stats && git rm -rfq . )
          fi
          python tools/run_summary.py ../stats/stats
          cd ../stats && git add stats && git commit -qm "Run summary $(date -u +%Y-%m-%dT%H:%MZ)" && git push -q origin stats

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v4