paths:
  output: "docs/"
  logs:   "logs/"
  data:   "data/"
  
domain:
  lat_min: 40.3
  lat_max: 45.1
  lon_min: 21.1
  lon_max: 31.3

models:
  gfs:
    enabled: true
    field: "CPRAT"        # convective precip rate, mm/h
    threshold: 0.5
  icon:
    enabled: true
    field: "LPI_CON_MAX"
    threshold: 10
  ifs:
    enabled: true
    field: "cp"           # convective precip, 3h mean rate mm/h (tp fallback)
    threshold: 0.5
    tp_threshold: 1.0

expand_pixels: 3

sigwx:
  graded: true     # label level HIGH = GFS + IFS agree near the area, MED = only one
  high_lpi: 20     # HIGH needs ICON LPI >= this + GFS/IFS (MED keeps the models.icon threshold)
  act_lpi: 20
  ocnl: 0.30
  frq: 0.60

viz:
  dpi: 150
  figsize: [14, 10]
  alpha: 0.4
  colors:
    HIGH: "#FF8C00"
    MED:  "#4A7C2E"
    LOW:  "#A8C77A"